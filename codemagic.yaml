workflows:
  ios-build:
    name: iOS IPA for local signing (free Apple account)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.9
      xcode: latest
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for local signing
        script: |
          set -euo pipefail
          ipa_path="$PWD/build/ios/flake-chicken-unsigned.ipa"
          package_dir=$(mktemp -d)
          trap 'rm -rf "$package_dir"' EXIT
          mkdir -p "$package_dir/Payload"
          cp -R build/ios/iphoneos/Runner.app "$package_dir/Payload/Runner.app"
          (cd "$package_dir" && zip -qry "$ipa_path" Payload)
    artifacts:
      - build/ios/flake-chicken-unsigned.ipa
